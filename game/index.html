<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lighthouse Keeper's Evening — spot the difference</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0f18; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; object-fit: contain; }

</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="The Lighthouse Keeper's Evening: two pictures of Gull Rock side by side. Click every difference in either picture."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
